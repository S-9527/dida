services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: dida
      POSTGRES_PASSWORD: dida123456
      POSTGRES_DB: dida
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dida -d dida"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
